# Optional: publish the web (PWA) version of Jejak Sehat to GitHub Pages, e.g. to open it on a laptop.
# Enable once: Settings → Pages → Source: "GitHub Actions". Then run this workflow manually (Actions tab).
# Only static app files are published; personal data always stays in each device's browser storage.
name: Jejak Sehat – Web (GitHub Pages)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: jejak-sehat-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: health-tracker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: health-tracker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: health-tracker/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
